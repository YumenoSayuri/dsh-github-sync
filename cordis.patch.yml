# Bundle patch for the GitHub sync plugin.
#
# The row points at a patch-relative path instead of a bare `@local/...`
# specifier: the loader converts `./` paths to file URLs and finds the package by
# walking up, so the row resolves no matter what the package is called or where
# it is linked from.
#
# The filename is also the module-generation key: the Loader caches modules by
# resolved URL and keeps serving the cached copy after a file's contents change.
# To pick up an edit without restarting the app, every changed file needs a new
# URL — rename the entry *and* the directory holding the changed modules. (Verified
# here: renaming only the entry left internal/ modules stale.)
- insert:
    - id: dsh-github-sync
      name: './plugin.mjs'
