# Bundle patch for the GitHub sync plugin.
#
# The row points at a patch-relative path: the loader converts `./` paths to file
# URLs and finds the package by walking up, so the row resolves no matter what the
# package is called or where it is linked from.
#
# This filename is also the module-generation key. The Loader caches modules by
# resolved URL and keeps serving a cached copy after a file's contents change, so
# picking up an edit without restarting the app means giving *every changed file*
# a new URL: rename the entry and the directory holding the changed modules.
# (Verified: renaming only the entry leaves core/ modules stale.)
- insert:
    - id: dsh-github-sync
      name: './main.mjs'
